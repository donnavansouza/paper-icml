# Relation R6 (film-review sentiment), the pre-declared reserve: used only if R5 fails its dev
# format gate. Written before any model output on these words. Inclusion rule: single common
# English adjectives whose plain reading in "The film was ___." is a clearly favorable or clearly unfavorable verdict on the
# film; no words whose verdict depends on genre (dark, scary, sad, slow, long), no negations and no intensifiers. Pairs join a
# positive and a negative adjective of the same token count, seeded.
