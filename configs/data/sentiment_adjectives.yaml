           marvelous, outstanding, terrific, splendid, magnificent, impressive, engaging, gripping, touching, clever, witty, funny,
           hilarious, thrilling, exciting, compelling, fascinating, stunning, gorgeous, lovely, pleasant, heartfelt, uplifting,
           inspiring, remarkable, extraordinary, masterful, flawless, perfect, refreshing, smart, powerful, memorable, captivating,
           enchanting, satisfying, good, nice, fun, joyful, elegant, sublime, exquisite, riveting, stellar, amazing, awesome,
           incredible, phenomenal, dazzling, glorious, breathtaking, magical, sensational, tremendous, fabulous, inventive]
negative: [awful, terrible, horrible, dreadful, boring, dull, tedious, bland, poor, bad, weak, lame, stupid, silly, pointless,
           awkward, clumsy, messy, sloppy, confusing, tiresome, lifeless, forgettable, mediocre, disappointing, frustrating,
           annoying, irritating, painful, unbearable, unwatchable, pathetic, ridiculous, shallow, hollow, cheap, ugly, miserable,
           worthless, useless, mindless, predictable, repetitive, overlong, sluggish, stale, trite, insipid, vapid, dreary, abysmal,
