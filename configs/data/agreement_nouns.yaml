# Relation R5 (subject-verb number agreement): the declared noun list, written before any model
# output on these nouns. Inclusion rule: everyday inanimate, concrete, countable objects (no people, animals or body
# parts, so no gender, person or animacy cue enters the transfer); singular and plural differ in spelling (no zero plurals such
# as sheep); no mass nouns and no plural-only nouns (scissors); no noun whose singular is mainly read as a verb after "The"
# (watch, ring, plant, train, sink, brush, hammer, fence, rock) and no plural that is a common third-person verb form read
# first (leaves). The singular and the plural of one noun form a concept pair (pairing: same_lemma); a pair whose forms differ
# in token count under a checkpoint's tokenizer is dropped by the build and listed in the card.
