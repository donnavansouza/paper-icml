[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "saeselect"
version = "0.1.0"
description = "A controlled benchmark of signals for choosing which SAE features to edit: J-lens, logit lens, attribution patching and association"
requires-python = ">=3.12"
# Lower bounds only: the environment the results were produced in is locked in
# requirements.lock. Nothing here should make pip change an installed package.
dependencies = [
    "torch>=2.4",
    "transformers>=5.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "pyarrow>=14",  # reads the wikitext parquet files
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The J-lens reference implementation, pinned to the commit that passed parity
# Needed for Stage 0 checks N1 and N2 and for the
# parity unit test; that test is skipped when jlens is absent.
lens = ["jlens @ git+https://github.com/anthropics/jacobian-lens@581d398613e5602a5af361e1c34d3a92ea82ba8e"]

[project.scripts]
saeselect = "saeselect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end runs of the CLI on the tiny random Gemma 3 model",
]
